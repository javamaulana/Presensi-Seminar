<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Presensi Seminar Kewirausahaan</title>
    <meta name="description" content="Presensi peserta seminar kewirausahaan.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page">
      <form class="attendance-card" id="attendanceForm">
        <header class="header">
          <p>Seminar Kewirausahaan</p>
          <h1>Presensi Peserta</h1>
        </header>

        <label class="field">
          <span>Tipe Peserta</span>
          <select id="participantType" name="participantType" required>
            <option value="">Pilih tipe peserta</option>
            <option value="mahasiswa">Mahasiswa Kewirausahaan</option>
            <option value="umum">Umum</option>
          </select>
        </label>

        <!-- Section for Mahasiswa Kewirausahaan -->
        <div id="mahasiswaSection" class="form-section" style="display: none;">
          <label class="field">
            <span>Kelas</span>
            <select id="className" name="institution" required>
              <option value="">Pilih kelas</option>
            </select>
          </label>

          <label class="field">
            <span>Nama</span>
            <select id="fullName" name="fullName" required disabled>
              <option value="">Pilih kelas dulu</option>
            </select>
          </label>

          <label class="field">
            <span>NIM</span>
            <input id="studentId" name="studentId" type="text" readonly placeholder="Terisi otomatis">
          </label>
        </div>

        <!-- Section for Umum -->
        <div id="umumSection" class="form-section" style="display: none;">
          <label class="field">
            <span>Nama</span>
            <input id="nameManual" name="nameManual" type="text" placeholder="Masukkan nama lengkap">
          </label>

          <label class="field">
            <span>NIM / No. Identitas</span>
            <input id="nimManual" name="nimManual" type="text" placeholder="Masukkan NIM atau no. identitas">
          </label>
        </div>

        <label class="field">
          <span>Email aktif</span>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="nama@email.com"
            required
          >
        </label>

        <div class="info-box" id="certInfoBox" style="display: none;">
          <p>ℹ️ Sertifikat akan dikirim paling lama <strong>24 jam</strong> ke email Anda.</p>
        </div>

        <button class="submit-button" type="submit">Kirim Presensi</button>
        <p class="status" id="formStatus" role="status" aria-live="polite"></p>
      </form>
    </main>

    <script src="script.js?v=20260901-1"></script>
  </body>
</html>
